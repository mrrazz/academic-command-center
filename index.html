<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>Academic Command Center</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   ACADEMIC COMMAND CENTER — redesign
   Neutral slate base · single amber accent · desaturated status
   ============================================================ */

:root{
  /* light mode (default) */
  --bg:#F4F5F7;
  --bg-grad:#EEF0F3;
  --surface:#FFFFFF;
  --surface-2:#F0F1F4;
  --surface-hi:#FBFBFC;
  --border:rgba(20,22,26,.09);
  --border-2:rgba(20,22,26,.14);
  --text:#191C22;
  --text2:#565D68;
  --text3:#8C939E;

  --amber:#C77D2E;
  --amber-ink:#8A5518;
  --amber-soft:rgba(199,125,46,.12);
  --amber-line:rgba(199,125,46,.30);

  --red:#BE5B4E;      /* overdue */
  --red-soft:rgba(190,91,78,.12);
  --orange:#C08039;   /* due soon */
  --orange-soft:rgba(192,128,57,.13);
  --yellow:#B08A34;   /* watch */
  --yellow-soft:rgba(176,138,52,.13);
  --green:#5E8E6C;    /* on track */
  --green-soft:rgba(94,142,108,.13);

  --shadow:0 1px 2px rgba(20,22,26,.05), 0 6px 20px rgba(20,22,26,.06);
  --shadow-lg:0 8px 40px rgba(20,22,26,.14);
  --radius:14px;
  --radius-sm:10px;
  --nav-h:64px;
  --sidebar-w:236px;
  --sidebar-collapsed:70px;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --ui:'Space Grotesk',system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#14161A;
  --bg-grad:#101216;
  --surface:#1B1E24;
  --surface-2:#22262E;
  --surface-hi:#242832;
  --border:rgba(255,255,255,.07);
  --border-2:rgba(255,255,255,.12);
  --text:#E7E9EE;
  --text2:#9AA1AD;
  --text3:#626A76;

  --amber:#D98A3D;
  --amber-ink:#F0B372;
  --amber-soft:rgba(217,138,61,.14);
  --amber-line:rgba(217,138,61,.32);

  --red:#CB6C5F;
  --red-soft:rgba(203,108,95,.15);
  --orange:#D08B4C;
  --orange-soft:rgba(208,139,76,.15);
  --yellow:#C6A34F;
  --yellow-soft:rgba(198,163,79,.14);
  --green:#6FAE84;
  --green-soft:rgba(111,174,132,.14);

  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 26px rgba(0,0,0,.34);
  --shadow-lg:0 12px 48px rgba(0,0,0,.5);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--ui);
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  line-height:1.5;
  overscroll-behavior-y:none;
}
a{color:var(--amber);text-decoration:none}
a:hover{color:var(--amber-ink)}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--amber-soft)}
input,select,textarea{font-family:inherit}

/* micro-label */
.ml{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);font-weight:600}
.mono{font-family:var(--mono);font-feature-settings:"tnum" 1}

/* ---------- App shell ---------- */
.app{min-height:100%}
.main-wrap{min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px)}

.topbar{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:saturate(1.4) blur(14px);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--border);
  padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar .date{font-family:var(--mono);font-size:12px;letter-spacing:.02em;color:var(--text3);font-weight:500}
.topbar .greet{font-size:19px;font-weight:600;letter-spacing:-.01em;margin-top:1px}
.topbar .greet b{color:var(--amber)}

.icon-btn{
  width:40px;height:40px;flex:0 0 auto;display:grid;place-items:center;
  border-radius:11px;border:1px solid var(--border);background:var(--surface);
  color:var(--text2);transition:.16s;
}
.icon-btn:hover{color:var(--text);border-color:var(--border-2)}
.icon-btn svg{width:19px;height:19px}

.content{max-width:960px;margin:0 auto;padding:16px 16px 30px}
.view{display:none;animation:fade .28s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.stack{display:flex;flex-direction:column;gap:16px}

/* ---------- Hero urgent ---------- */
.hero{
  position:relative;overflow:hidden;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:16px 16px 15px;
  box-shadow:var(--shadow);
}
.hero.is-urgent{border-color:var(--amber-line)}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--amber)}
.hero.calm::before{background:var(--green)}
.hero-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.hero-badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--amber-ink)}
.hero-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}
.hero-body{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.hero-title{font-size:20px;font-weight:600;letter-spacing:-.015em;line-height:1.2}
.hero-sub{margin-top:5px;font-size:13px;color:var(--text2)}
.hero-sub .tag{font-family:var(--mono);font-weight:600;color:var(--text);font-size:12px}
.hero-due{font-family:var(--mono);font-weight:600}
.hero-jump{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;
  background:var(--amber);color:#fff;border:none;
  padding:11px 15px;border-radius:11px;font-size:13.5px;font-weight:600;
  box-shadow:0 4px 14px rgba(199,125,46,.34);transition:.16s;
}
[data-theme="dark"] .hero-jump{color:#1a1206}
.hero-jump:hover{transform:translateY(-1px);filter:brightness(1.05)}
.hero-jump svg{width:15px;height:15px}
.hero.calm .hero-badge{color:var(--green)}
.hero.calm .hero-badge .dot{background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}

/* ---------- Stat row ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 14px 12px;box-shadow:var(--shadow);position:relative;
}
.stat .num{font-family:var(--mono);font-size:34px;font-weight:700;line-height:1;letter-spacing:-.03em}
.stat .lbl{margin-top:7px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--text3)}
.stat.over .num{color:var(--red)}
.stat.soon .num{color:var(--orange)}
.stat.done .num{color:var(--green)}
.stat .spark{position:absolute;top:14px;right:14px;width:8px;height:8px;border-radius:50%}
.stat.over .spark{background:var(--red)}
.stat.soon .spark{background:var(--orange)}
.stat.done .spark{background:var(--green)}

/* ---------- Section head ---------- */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 0}
.sec-head h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--text2)}
.sec-head .link{font-size:12.5px;color:var(--text3);font-weight:600}
.sec-head .link:hover{color:var(--amber)}

/* ---------- Priority list rows ---------- */
.rows{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.row{
  display:flex;align-items:center;gap:11px;padding:13px 14px;
  border-bottom:1px solid var(--border);cursor:pointer;transition:background .14s;
  width:100%;text-align:left;background:none;border-left:none;border-right:none;border-top:none;color:inherit;
}
.rows .row:last-child{border-bottom:none}
.row:hover{background:var(--surface-2)}
.row .sdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.row .sdot.over{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.row .sdot.soon{background:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
.row .sdot.ok{background:var(--text3)}
.row .sdot.done{background:var(--green)}
.row .ctag{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text3);flex:0 0 auto;width:56px}
.row .rtitle{flex:1;font-size:14px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.is-done .rtitle{color:var(--text3);text-decoration:line-through}
.row .rdue{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--text2);flex:0 0 auto}
.row .rdue.over{color:var(--red)}
.row .rdue.soon{color:var(--orange)}

.empty{padding:26px 18px;text-align:center;color:var(--text2);font-size:14px}
.empty .big{font-size:15px;font-weight:600;color:var(--text);margin-bottom:3px}
.empty svg{width:26px;height:26px;color:var(--green);margin-bottom:8px}

/* ---------- Grade summary ---------- */
.grade-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border)}
.grade-row:last-child{border-bottom:none}
.grade-row .gc{font-family:var(--mono);font-size:12px;font-weight:700;width:56px;flex:0 0 auto;color:var(--text)}
.grade-row .gname{flex:1;font-size:13px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grade-row .gnum{font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:-.02em}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.05em;font-weight:700;text-transform:uppercase;padding:4px 9px;border-radius:999px;flex:0 0 auto}
.pill .pd{width:6px;height:6px;border-radius:50%}
.pill.good{background:var(--green-soft);color:var(--green)}.pill.good .pd{background:var(--green)}
.pill.warn{background:var(--yellow-soft);color:var(--yellow)}.pill.warn .pd{background:var(--yellow)}
.pill.soon{background:var(--orange-soft);color:var(--orange)}.pill.soon .pd{background:var(--orange)}
.pill.over{background:var(--red-soft);color:var(--red)}.pill.over .pd{background:var(--red)}

/* ---------- Quick launch ---------- */
.launch{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.launch a{
  display:flex;align-items:center;gap:11px;padding:13px 13px;border-radius:var(--radius-sm);
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow);transition:.16s;
}
.launch a:hover{border-color:var(--border-2);transform:translateY(-1px)}
.launch .lg{width:30px;height:30px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:12px;background:var(--surface-2);color:var(--text2)}
.launch .lsub{display:block;font-size:10.5px;font-weight:500;color:var(--text3);letter-spacing:.02em}

/* ---------- Course cards ---------- */
.course-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;position:relative;
}
.course-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cc,var(--text3))}
.cc-head{padding:15px 16px 14px 18px}
.cc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.cc-code{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--cc,var(--text2));letter-spacing:.02em}
.cc-name{font-size:16.5px;font-weight:600;letter-spacing:-.01em;margin-top:2px}
.cc-prof{font-size:12.5px;color:var(--text3);margin-top:3px}
.cc-grade{text-align:right;flex:0 0 auto}
.cc-grade .gnum{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1}
.cc-meta{display:flex;align-items:center;gap:10px;margin-top:13px;flex-wrap:wrap}
.cc-next{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px}
.cc-next .mono{color:var(--text);font-weight:600}
.cc-next svg{width:13px;height:13px;color:var(--text3)}
.tutor-btn{
  margin-left:auto;display:inline-flex;align-items:center;gap:7px;
  background:var(--surface-2);border:1px solid var(--border-2);color:var(--text);
  padding:8px 13px;border-radius:10px;font-size:13px;font-weight:600;transition:.16s;
}
.tutor-btn:hover{border-color:var(--amber-line);color:var(--amber-ink)}
.tutor-btn svg{width:15px;height:15px;transition:transform .22s}
.course-card.open .tutor-btn{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber-ink)}
.course-card.open .tutor-btn svg{transform:rotate(180deg)}

/* tutor panel */
.tutor{display:none;border-top:1px solid var(--border);background:var(--surface-hi)}
.course-card.open .tutor{display:block;animation:fade .24s ease}
.tutor-tabs{display:flex;gap:4px;padding:12px 12px 0;overflow-x:auto;scrollbar-width:none}
.tutor-tabs::-webkit-scrollbar{display:none}
.tt{
  flex:0 0 auto;padding:8px 13px;border-radius:9px;font-size:12.5px;font-weight:600;
  color:var(--text3);background:none;border:1px solid transparent;transition:.14s;white-space:nowrap;
}
.tt:hover{color:var(--text2)}
.tt.active{color:var(--amber-ink);background:var(--amber-soft);border-color:var(--amber-line)}
.tutor-body{padding:14px 14px 16px}

/* ---------- Quiz engine (preserved class names, restyled) ---------- */
.section-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--text3);margin-bottom:9px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px}
.quiz-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:13px 14px;margin-bottom:9px;transition:.15s;box-shadow:var(--shadow);
}
.quiz-card:hover{border-color:var(--border-2);transform:translateY(-1px)}
.quiz-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.quiz-card-title{font-size:14px;font-weight:600;letter-spacing:-.01em}
.quiz-card-sub{font-size:12px;color:var(--text3);margin-top:2px}
.quiz-best{font-family:var(--mono);font-size:15px;font-weight:700;flex:0 0 auto}
.quiz-meta{font-size:11.5px;color:var(--text3);margin-top:8px;font-family:var(--mono)}

.quiz-progress{height:5px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-bottom:16px}
#quiz-progress-fill{height:100%;background:var(--amber);width:0;transition:width .3s;border-radius:999px}

.q-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:15px;margin-bottom:11px}
.q-num{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--text3);font-weight:600;margin-bottom:7px}
.q-stem{font-size:14.5px;font-weight:500;line-height:1.45;margin-bottom:12px;color:var(--text)}
.except{color:var(--red);font-weight:700;letter-spacing:.03em}
.opt{
  display:flex;align-items:flex-start;gap:11px;padding:11px 12px;border-radius:10px;
  border:1px solid var(--border);margin-bottom:7px;font-size:13.5px;line-height:1.4;
  cursor:pointer;transition:.13s;background:var(--surface-hi);
}
.opt:hover{border-color:var(--border-2)}
.opt-letter{
  font-family:var(--mono);font-size:11px;font-weight:700;width:22px;height:22px;flex:0 0 auto;
  display:grid;place-items:center;border-radius:6px;background:var(--surface-2);color:var(--text3);margin-top:-1px;
}
.opt.selected{border-color:var(--amber-line);background:var(--amber-soft)}
.opt.selected .opt-letter{background:var(--amber);color:#fff}
[data-theme="dark"] .opt.selected .opt-letter{color:#1a1206}
.opt.locked{cursor:default}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.correct .opt-letter{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .opt-letter{background:var(--red);color:#fff}
.q-explain{margin-top:10px;padding:11px 12px;border-radius:9px;background:var(--surface-2);font-size:12.5px;line-height:1.55;color:var(--text2)}
.q-explain strong{color:var(--text)}

.quiz-result{text-align:center;padding:18px 14px 6px}
.quiz-score-big{font-family:var(--mono);font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.quiz-score-pct{font-size:13px;color:var(--text2);margin-top:6px}
.quiz-actions{display:flex;gap:9px;margin-top:14px}

.btn{
  flex:1;padding:11px 14px;border-radius:10px;font-size:13.5px;font-weight:600;
  background:var(--surface-2);border:1px solid var(--border-2);color:var(--text);transition:.15s;
}
.btn:hover{border-color:var(--text3)}
.btn-primary{background:var(--amber);border-color:var(--amber);color:#fff;box-shadow:0 4px 14px rgba(199,125,46,.3)}
[data-theme="dark"] .btn-primary{color:#1a1206}
.btn-primary:hover{filter:brightness(1.05);border-color:var(--amber)}
#quiz-submit-wrap{display:flex;gap:9px;margin-top:6px}
#quiz-back-btn{
  display:none;background:none;border:none;color:var(--text3);font-size:12.5px;font-weight:600;
  padding:0 0 12px;
}
#quiz-back-btn:hover{color:var(--amber)}
#study-sub{display:none}

/* ---------- Key terms / flashcards / checklist ---------- */
.term{padding:12px 2px;border-bottom:1px solid var(--border)}
.term:last-child{border-bottom:none}
.term .tt-term{font-size:14px;font-weight:600;color:var(--text)}
.term .tt-def{font-size:13px;color:var(--text2);margin-top:3px;line-height:1.5}
.terms-scroll{max-height:340px;overflow-y:auto}

.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.flip{perspective:1000px;height:118px;cursor:pointer}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.15,.2,1);transform-style:preserve-3d}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.flip-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;
  display:flex;align-items:center;justify-content:center;text-align:center;background:var(--surface);
}
.flip-front{font-size:14px;font-weight:600}
.flip-front .fhint{position:absolute;bottom:8px;right:10px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);font-weight:600}
.flip-back{transform:rotateY(180deg);background:var(--surface-2);font-size:12px;color:var(--text2);line-height:1.45}

.check{display:flex;align-items:center;gap:11px;padding:12px 4px;border-bottom:1px solid var(--border);cursor:pointer}
.check:last-child{border-bottom:none}
.check .box{width:20px;height:20px;flex:0 0 auto;border-radius:6px;border:1.6px solid var(--border-2);display:grid;place-items:center;transition:.14s}
.check .box svg{width:12px;height:12px;color:#fff;opacity:0}
.check.on .box{background:var(--amber);border-color:var(--amber)}
[data-theme="dark"] .check.on .box svg{color:#1a1206}
.check.on .box svg{opacity:1}
.check .ctext{font-size:13.5px;font-weight:500}
.check.on .ctext{color:var(--text3);text-decoration:line-through}

/* ---------- Assignments filters ---------- */
.chips{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--text2);background:var(--surface);border:1px solid var(--border);transition:.14s}
.chip:hover{border-color:var(--border-2)}
.chip.active{background:var(--amber-soft);border-color:var(--amber-line);color:var(--amber-ink)}
.check-toggle{width:22px;height:22px;flex:0 0 auto;border-radius:6px;border:1.6px solid var(--border-2);display:grid;place-items:center;background:none}
.check-toggle svg{width:12px;height:12px;opacity:0;color:#fff}
.row.is-done .check-toggle{background:var(--green);border-color:var(--green)}
.row.is-done .check-toggle svg{opacity:1}

/* ---------- Planner ---------- */
.plan-group{margin-bottom:18px}
.plan-label{display:flex;align-items:baseline;gap:9px;margin:0 2px 9px}
.plan-label .pl{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.plan-label .pd{font-family:var(--mono);font-size:11px;color:var(--text3)}
.plan-label.over .pl{color:var(--red)}
.plan-label.today .pl{color:var(--amber-ink)}

/* ---------- Files ---------- */
.file-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--border)}
.file-row:last-child{border-bottom:none}
.file-ico{width:34px;height:34px;flex:0 0 auto;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;color:var(--text3);font-family:var(--mono);font-size:9px;font-weight:700}
.file-name{flex:1;font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-sub{font-size:11px;color:var(--text3);font-family:var(--mono);margin-top:1px}
.file-del{width:32px;height:32px;border-radius:8px;border:none;background:none;color:var(--text3);display:grid;place-items:center}
.file-del:hover{color:var(--red);background:var(--red-soft)}
.file-del svg{width:15px;height:15px}
.notice{display:flex;gap:12px;padding:15px;border-radius:var(--radius-sm);background:var(--amber-soft);border:1px solid var(--amber-line);align-items:flex-start}
.notice svg{width:20px;height:20px;color:var(--amber);flex:0 0 auto;margin-top:1px}
.notice .nt{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px}
.notice .nb{font-size:12.5px;color:var(--text2);line-height:1.5}
.notice .nb a{font-weight:600}

/* ---------- Contacts ---------- */
.contact{display:flex;align-items:center;gap:13px;padding:13px 14px;border-bottom:1px solid var(--border)}
.contact:last-child{border-bottom:none}
.avatar{width:38px;height:38px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:13px;background:var(--surface-2);color:var(--text2)}
.contact .cn{font-size:14px;font-weight:600}
.contact .cr{font-size:12px;color:var(--text3);margin-top:1px}
.contact .clink{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--amber)}

/* ---------- Settings ---------- */
.set-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.set-item{padding:15px 16px;border-bottom:1px solid var(--border)}
.set-item:last-child{border-bottom:none}
.set-item .sl{font-size:14px;font-weight:600}
.set-item .sd{font-size:12.5px;color:var(--text3);margin-top:2px;line-height:1.45}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;margin-top:11px}
.seg button{padding:8px 16px;border-radius:8px;border:none;background:none;font-size:13px;font-weight:600;color:var(--text2)}
.seg button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.field{display:block;margin-top:11px}
.field input,.field select,.field textarea{
  width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border-2);
  background:var(--bg);color:var(--text);font-size:14px;transition:.14s;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--amber);background:var(--surface)}
.set-actions{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
.set-actions .btn{flex:0 1 auto;min-width:120px}
.btn-danger{color:var(--red)!important;border-color:var(--red-soft)!important}
.btn-danger:hover{border-color:var(--red)!important;background:var(--red-soft)!important}

/* ---------- Bottom nav (mobile) ---------- */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border-top:1px solid var(--border);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:none;color:var(--text3);font-size:10px;font-weight:600;letter-spacing:.02em;transition:.14s;
}
.nav-item svg{width:22px;height:22px;stroke-width:1.8}
.nav-item.active{color:var(--amber)}
.nav-item:active{transform:scale(.93)}

.overflow-sheet{
  position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;
  background:rgba(0,0,0,.4);backdrop-filter:blur(2px);
}
.overflow-sheet.open{display:flex;animation:fade .18s}
.sheet{
  width:100%;background:var(--surface);border-radius:20px 20px 0 0;padding:10px 12px calc(20px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);box-shadow:var(--shadow-lg);
}
.sheet-grip{width:38px;height:4px;border-radius:2px;background:var(--border-2);margin:6px auto 10px}
.sheet-item{display:flex;align-items:center;gap:14px;width:100%;padding:14px 12px;border-radius:12px;background:none;border:none;color:var(--text);font-size:15px;font-weight:600;text-align:left}
.sheet-item:hover{background:var(--surface-2)}
.sheet-item svg{width:21px;height:21px;color:var(--text2);stroke-width:1.8}
.sheet-item.active{color:var(--amber)}
.sheet-item.active svg{color:var(--amber)}

/* ---------- Sidebar (desktop) ---------- */
.sidebar{display:none}

@media(min-width:900px){
  .bottomnav{display:none}
  .main-wrap{padding-bottom:0;margin-left:var(--sidebar-w);transition:margin-left .2s}
  .app.collapsed .main-wrap{margin-left:var(--sidebar-collapsed)}
  .sidebar{
    display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);z-index:45;
    background:var(--surface);border-right:1px solid var(--border);padding:18px 12px 14px;transition:width .2s;
  }
  .app.collapsed .sidebar{width:var(--sidebar-collapsed)}
  .sb-brand{display:flex;align-items:center;gap:11px;padding:6px 8px 18px}
  .sb-logo{width:34px;height:34px;flex:0 0 auto;border-radius:10px;background:var(--amber);display:grid;place-items:center;color:#fff;font-family:var(--mono);font-weight:700;font-size:15px}
  [data-theme="dark"] .sb-logo{color:#1a1206}
  .sb-brand .bt{font-size:14px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
  .sb-brand .bs{font-size:10px;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
  .app.collapsed .sb-brand .bt,.app.collapsed .sb-brand .bs{display:none}
  .sb-nav{display:flex;flex-direction:column;gap:3px;flex:1}
  .sb-item{
    display:flex;align-items:center;gap:13px;padding:11px 11px;border-radius:11px;
    background:none;border:none;color:var(--text2);font-size:14px;font-weight:600;transition:.13s;width:100%;text-align:left;white-space:nowrap;
  }
  .sb-item svg{width:20px;height:20px;flex:0 0 auto;stroke-width:1.8}
  .sb-item:hover{background:var(--surface-2);color:var(--text)}
  .sb-item.active{background:var(--amber-soft);color:var(--amber-ink)}
  .app.collapsed .sb-item .sbl{display:none}
  .app.collapsed .sb-item{justify-content:center;padding:11px 0}
  .sb-collapse{margin-top:6px;display:flex;align-items:center;gap:13px;padding:10px 11px;border-radius:11px;background:none;border:none;color:var(--text3);font-size:12.5px;font-weight:600;width:100%}
  .sb-collapse:hover{background:var(--surface-2);color:var(--text2)}
  .sb-collapse svg{width:18px;height:18px;transition:transform .2s}
  .app.collapsed .sb-collapse svg{transform:rotate(180deg)}
  .app.collapsed .sb-collapse .sbl{display:none}

  .content{padding:22px 26px 40px}
  .topbar{padding:20px 26px 15px}
  .dash-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
  .dash-grid .stack{gap:16px}
  .stat .num{font-size:38px}
  .courses-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .course-card.open{grid-column:1 / -1}
  .launch{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:900px){ .mobile-only{display:none} }
@media(max-width:899px){ .desktop-only{display:none} }

/* ---------- Modal ---------- */
.modal-root{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.45);backdrop-filter:blur(3px)}
.modal-root.open{display:flex;animation:fade .18s}
.modal{
  width:100%;max-width:440px;background:var(--surface);border:1px solid var(--border);border-radius:18px;
  box-shadow:var(--shadow-lg);max-height:88vh;overflow-y:auto;
}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 18px 4px}
.modal-head h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
.modal-body{padding:8px 18px 18px}
.modal-foot{display:flex;gap:9px;padding:0 18px 18px}
.fl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--text3);display:block;margin:12px 2px 0}

.fab{
  position:fixed;right:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);z-index:35;
  width:52px;height:52px;border-radius:16px;border:none;background:var(--amber);color:#fff;
  display:grid;place-items:center;box-shadow:0 6px 20px rgba(199,125,46,.4);transition:.16s;
}
[data-theme="dark"] .fab{color:#1a1206}
.fab:hover{transform:translateY(-2px) scale(1.03)}
.fab svg{width:24px;height:24px}
@media(min-width:900px){.fab{bottom:26px;right:26px}}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- Sidebar (desktop) -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand">
      <div class="sb-logo">A</div>
      <div><div class="bt">Command Center</div><div class="bs">MWCC</div></div>
    </div>
    <nav class="sb-nav" id="sbNav"></nav>
    <button class="sb-collapse" onclick="toggleSidebar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="sbl">Collapse</span>
    </button>
  </aside>

  <div class="main-wrap">
    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-row">
        <div>
          <div class="date mono" id="topDate">—</div>
          <div class="greet" id="topGreet">Evening, <b>Michael</b></div>
        </div>
        <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle theme"></button>
      </div>
    </header>

    <main class="content">
      <!-- DASHBOARD -->
      <section class="view active" id="view-dashboard">
        <div class="stack" style="gap:16px">
          <div id="heroSlot"></div>
          <div class="dash-grid">
            <div class="stack">
              <div id="statsSlot"></div>
              <div>
                <div class="sec-head" style="margin-bottom:9px"><h2>Needs action now</h2><a class="link" onclick="go('assignments')">All &rsaquo;</a></div>
                <div id="prioritySlot"></div>
              </div>
            </div>
            <div class="stack">
              <div>
                <div class="sec-head" style="margin-bottom:9px"><h2>Grades</h2><a class="link" onclick="go('courses')">Courses &rsaquo;</a></div>
                <div id="gradeSlot"></div>
              </div>
              <div>
                <div class="sec-head" style="margin-bottom:9px"><h2>Quick launch</h2></div>
                <div class="launch" id="launchSlot"></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ASSIGNMENTS -->
      <section class="view" id="view-assignments">
        <div class="chips" id="asgChips"></div>
        <div id="asgSlot"></div>
      </section>

      <!-- COURSES -->
      <section class="view" id="view-courses">
        <div class="courses-grid" id="coursesSlot"></div>
      </section>

      <!-- PLANNER -->
      <section class="view" id="view-planner">
        <div id="plannerSlot"></div>
      </section>

      <!-- FILES -->
      <section class="view" id="view-files">
        <div id="filesSlot"></div>
      </section>

      <!-- CONTACTS -->
      <section class="view" id="view-contacts">
        <div id="contactsSlot"></div>
      </section>

      <!-- SETTINGS -->
      <section class="view" id="view-settings">
        <div id="settingsSlot"></div>
      </section>

      <!-- GRADES -->
      <section class="view" id="view-grades">
        <div class="sec-head" style="margin-bottom:9px"><h2>Course standing</h2></div>
        <div id="gradeStanding"></div>
        <div class="sec-head" style="margin:16px 0 9px"><h2>Record a grade</h2></div>
        <div class="card">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
            <div><div class="fl">Course</div><label class="field"><select id="g_course" onchange="updateGradeCategories()"></select></label></div>
            <div><div class="fl">Category</div><label class="field"><select id="g_cat" onchange="applyGradeCategory()"><option value="">— none —</option></select></label></div>
          </div>
          <div class="fl" style="margin-top:10px">Assignment</div>
          <label class="field"><input id="g_name" placeholder="e.g. Quiz 1"></label>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px">
            <div><div class="fl">Score</div><label class="field"><input id="g_score" type="number" inputmode="decimal" placeholder="85"></label></div>
            <div><div class="fl">Out of</div><label class="field"><input id="g_outof" type="number" inputmode="decimal" placeholder="100"></label></div>
            <div><div class="fl">Weight %</div><label class="field"><input id="g_weight" type="number" inputmode="decimal" placeholder="auto"></label></div>
          </div>
          <button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="addGrade()">+ Record grade</button>
        </div>
        <div class="sec-head" style="margin:16px 0 9px"><h2>All grades</h2></div>
        <div id="gradeList"></div>
      </section>

      <!-- DEGREE -->
      <section class="view" id="view-degree">
        <div id="degreeSlot"></div>
      </section>
    </main>
  </div>

  <!-- Bottom nav (mobile) -->
  <nav class="bottomnav" id="bottomnav"></nav>
  <button class="fab" id="fab" onclick="fabAction()" aria-label="Add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg></button>
</div>

<!-- overflow sheet -->
<div class="overflow-sheet" id="overflowSheet" onclick="if(event.target===this)closeSheet()">
  <div class="sheet"><div class="sheet-grip"></div><div id="sheetNav"></div></div>
</div>

<!-- modal root -->
<div class="modal-root" id="modalRoot" onclick="if(event.target===this)closeModal()"></div>

<script>
/* ============================================================
   ICONS
   ============================================================ */
const ICONS = {
  dashboard:'<path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/>',
  assignments:'<rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8.5 9l2 2 4-4M8.5 15h6" stroke-linecap="round" stroke-linejoin="round"/>',
  courses:'<path d="M3 6.5l9-3.5 9 3.5-9 3.5z"/><path d="M6 8.5v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5" stroke-linecap="round"/>',
  planner:'<rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9h17M8 3v3M16 3v3" stroke-linecap="round"/>',
  files:'<path d="M4 6.5A1.5 1.5 0 015.5 5H10l2 2.2h6.5A1.5 1.5 0 0120 8.7v9.3a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 18z" stroke-linejoin="round"/>',
  contacts:'<circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.4 3.1-5.6 7-5.6s7 2.2 7 5.6" stroke-linecap="round"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 7l2.1 1.2M17.7 15.8l2.1 1.2M4.2 17l2.1-1.2M17.7 8.2l2.1-1.2" stroke-linecap="round"/>',
  more:'<circle cx="5.5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18.5" cy="12" r="1.6"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8" stroke-linecap="round"/>',
  moon:'<path d="M20 13.5A8 8 0 1110.5 4a6.3 6.3 0 009.5 9.5z" stroke-linejoin="round"/>',
  calendar:'<rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9h17M8 3v3M16 3v3" stroke-linecap="round"/>',
  jump:'<path d="M5 12h13M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/>',
  tutor:'<path d="M6 9l6-3.5L18 9l-6 3.5z"/><path d="M9 11v3.5c0 .9 1.3 1.5 3 1.5s3-.6 3-1.5V11" stroke-linecap="round"/><path d="M6 19h.01" /><path d="M6 9l-.5 5" stroke-linecap="round"/>',
  chev:'<path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/>',
  check:'<path d="M5 12l5 5L20 6" stroke-linecap="round" stroke-linejoin="round"/>',
  clock:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4.4l2.8 1.6" stroke-linecap="round"/>',
  trash:'<path d="M4 7h16M9 7V5h6v2M6 7l1 12.5h10L18 7" stroke-linecap="round" stroke-linejoin="round"/>',
  info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01" stroke-linecap="round"/>',
  smile:'<path d="M5 13l5 5L20 7" stroke-linecap="round" stroke-linejoin="round"/>',
  grades:'<path d="M4 20h16M7.5 20v-6M12 20V8M16.5 20v-9" stroke-linecap="round"/>',
  degree:'<path d="M12 4L2 9l10 5 10-5z" stroke-linejoin="round"/><path d="M20 9.4v4.6M6 11.5V15c0 1.3 2.7 2.4 6 2.4s6-1.1 6-2.4v-3.5" stroke-linecap="round"/>'
};
function svg(name,cls){return `<svg class="${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">${ICONS[name]||''}</svg>`;}

/* ============================================================
   NAV
   ============================================================ */
const NAV = [
  {id:'dashboard',   label:'Dashboard',   icon:'dashboard',   primary:true},
  {id:'assignments', label:'Assignments', icon:'assignments', primary:true},
  {id:'courses',     label:'Courses',     icon:'courses',     primary:true},
  {id:'planner',     label:'Planner',     icon:'planner',     primary:true},
  {id:'grades',      label:'Grades',      icon:'grades',      primary:false},
  {id:'degree',      label:'Degree',      icon:'degree',      primary:false},
  {id:'files',       label:'Files',       icon:'files',       primary:false},
  {id:'contacts',    label:'Contacts',    icon:'contacts',    primary:false},
  {id:'settings',    label:'Settings',    icon:'settings',    primary:false}
];
let currentView='dashboard';

function buildNav(){
  // sidebar (all)
  document.getElementById('sbNav').innerHTML = NAV.map(n=>
    `<button class="sb-item" data-nav="${n.id}" onclick="go('${n.id}')">${svg(n.icon)}<span class="sbl">${n.label}</span></button>`).join('');
  // bottom (4 primary + more)
  const primary = NAV.filter(n=>n.primary);
  document.getElementById('bottomnav').innerHTML =
    primary.map(n=>`<button class="nav-item" data-nav="${n.id}" onclick="go('${n.id}')">${svg(n.icon)}<span>${n.label}</span></button>`).join('') +
    `<button class="nav-item" id="moreBtn" onclick="openSheet()">${svg('more')}<span>More</span></button>`;
  // overflow sheet (non-primary)
  document.getElementById('sheetNav').innerHTML = NAV.filter(n=>!n.primary).map(n=>
    `<button class="sheet-item" data-nav="${n.id}" onclick="go('${n.id}');closeSheet()">${svg(n.icon)}<span>${n.label}</span></button>`).join('');
}
function go(view){
  currentView=view;
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active', v.id==='view-'+view));
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active', b.dataset.nav===view));
  const inOverflow = NAV.find(n=>n.id===view && !n.primary);
  const moreBtn=document.getElementById('moreBtn'); if(moreBtn) moreBtn.classList.toggle('active', !!inOverflow);
  const fab=document.getElementById('fab'); if(fab) fab.style.display = (['dashboard','assignments','planner'].includes(view))?'grid':'none';
  const R={assignments:renderAssignments,courses:renderCourses,planner:renderPlanner,files:initFiles,contacts:renderContacts,settings:renderSettings,dashboard:renderDashboard,grades:renderGrades,degree:renderDegree};
  (R[view]||(()=>{}))();
  document.querySelector('.content').scrollTo?.(0,0);
  window.scrollTo(0,0);
}
function toggleSidebar(){document.getElementById('app').classList.toggle('collapsed');}
function openSheet(){document.getElementById('overflowSheet').classList.add('open');}
function closeSheet(){document.getElementById('overflowSheet').classList.remove('open');}

/* ============================================================
   STATE + SEED
   ============================================================ */
const LS_KEY='acc_state_v2';
let state={};
function todayISO(off){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+(off||0));return d.toISOString().slice(0,10);}
let _uid=0; const uid=()=> 'a'+(Date.now().toString(36))+(_uid++);

function seedState(){
  const dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  return {
    theme: dark?'dark':'light',
    courses:[
      {code:'SOC 205', name:'Social Problems',              prof:'Prof. Rivera',       grade:91},
      {code:'ECO 101', name:'Principles of Macroeconomics', prof:'Prof. Chen',         grade:78},
      {code:'POL 211', name:'American Government',           prof:'Prof. Shane Martin', grade:85},
      {code:'BIO 109', name:'Introductory Biology',          prof:'Prof. Okafor',       grade:69},
      {code:'PSY 240', name:'Abnormal Psychology',           prof:'Prof. Bennett',      grade:88}
    ],

/* ============================================================
   HELPERS
   ============================================================ */
const COURSE_TINT={'SOC 205':'#6B7E9E','ECO 101':'#6E9B77','POL 211':'#8C7EA0','BIO 109':'#5E9490','PSY 240':'#A67F86'};
function courseColor(course){ return COURSE_TINT[course] || 'var(--text3)'; }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function courseName(code){const c=(state.courses||[]).find(c=>c.code===code);return c?c.name:code;}
function daysUntil(iso){const d=new Date(iso+'T00:00:00');const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/86400000);}
function fmtDue(iso){const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}
function dueLabel(iso){const n=daysUntil(iso);if(n<0)return {txt:Math.abs(n)+'d late',cls:'over'};if(n===0)return {txt:'Today',cls:'soon'};if(n===1)return {txt:'Tomorrow',cls:'soon'};if(n<=3)return {txt:fmtDue(iso),cls:'soon'};return {txt:fmtDue(iso),cls:''};}
function urgencyClass(a){if(a.status==='done')return 'done';const n=daysUntil(a.due);if(n<0)return 'over';if(n<=3)return 'soon';return 'ok';}
function activeSorted(){return state.assignments.filter(a=>a.status!=='done').sort((a,b)=>daysUntil(a.due)-daysUntil(b.due));}
function risk(g){if(g>=90)return{l:'On track',c:'good'};if(g>=83)return{l:'Watch',c:'warn'};if(g>=75)return{l:'At risk',c:'soon'};return{l:'Critical',c:'over'};}
function letterGrade(g){if(g>=93)return'A';if(g>=90)return'A-';if(g>=87)return'B+';if(g>=83)return'B';if(g>=80)return'B-';if(g>=77)return'C+';if(g>=73)return'C';if(g>=70)return'C-';if(g>=60)return'D';return'F';}
function gradeColor(g){return g>=90?'var(--green)':g>=83?'var(--yellow)':g>=75?'var(--orange)':'var(--red)';}
function nextDeadline(code){return state.assignments.filter(a=>a.course===code&&a.status!=='done').sort((a,b)=>daysUntil(a.due)-daysUntil(b.due))[0];}

let asgFilter='open';
function renderAssignments(){
  const filters=[['open','Open'],['over','Overdue'],['soon','Due soon'],['done','Done'],['all','All']];
  document.getElementById('asgChips').innerHTML=filters.map(([k,l])=>`<button class="chip ${asgFilter===k?'active':''}" onclick="setAsgFilter('${k}')">${l}</button>`).join('');
  let items=state.assignments.slice();
  items = items.filter(a=>{
    const n=daysUntil(a.due);
    if(asgFilter==='open')return a.status!=='done';
    if(asgFilter==='over')return a.status!=='done'&&n<0;
    if(asgFilter==='soon')return a.status!=='done'&&n>=0&&n<=3;
    if(asgFilter==='done')return a.status==='done';
    return true;
  }).sort((a,b)=>{if((a.status==='done')!==(b.status==='done'))return a.status==='done'?1:-1;return daysUntil(a.due)-daysUntil(b.due);});
  const slot=document.getElementById('asgSlot');
  if(!items.length){slot.innerHTML=`<div class="rows"><div class="empty">${svg('smile')}<div class="big">Nothing here.</div>No assignments match this filter.</div></div>`;return;}
  slot.innerHTML=`<div class="rows">${items.map(a=>{
    const dl=dueLabel(a.due); const u=urgencyClass(a); const dn=a.status==='done';
    return `<div class="row ${dn?'is-done':''}">
      <button class="check-toggle" onclick="toggleAsg('${a.id}')">${svg('check')}</button>
      <span class="ctag">${esc(a.course.split(' ')[0])}</span>
      <span class="rtitle">${esc(a.title)}</span>
      <span class="rdue ${dn?'':dl.cls}">${dn?'✓':dl.txt}</span>
    </div>`;
  }).join('')}</div>`;
}
function setAsgFilter(k){asgFilter=k;renderAssignments();}
function toggleAsg(id){const a=state.assignments.find(x=>x.id===id);if(!a)return;a.status=a.status==='done'?'todo':'done';saveState();renderAssignments();}

function cssId(code){return code.replace(/\s+/g,'-');}
function tabLabel(t){return {quizzes:'Quizzes',resources:'Resources',terms:'Key Terms',flashcards:'Flashcards',checklist:'Checklist'}[t];}
function toggleTutor(code){
  if(openCourse===code){openCourse=null;}
  else {openCourse=code; tutorTab='quizzes';}
  closeQuiz();
  renderCourses();
}
function setTutorTab(code,t){tutorTab=t;closeQuiz();
  document.querySelectorAll(`#tutor-${cssId(code)} .tt`).forEach(b=>b.classList.toggle('active',b.dataset.tt===t));
  renderTutorBody(code);
}
function renderTutorBody(code){
  const body=document.getElementById('tbody-'+cssId(code));
  if(!body)return;
  if(tutorTab==='quizzes')      body.innerHTML=tutorQuizzesHTML(code);
  else if(tutorTab==='resources')body.innerHTML=tutorResourcesHTML(code);
  else if(tutorTab==='terms')    body.innerHTML=tutorTermsHTML(code);
  else if(tutorTab==='flashcards')body.innerHTML=tutorFlashHTML(code);
  else if(tutorTab==='checklist')body.innerHTML=tutorChecklistHTML(code);
}

/* -- Quizzes tab: builds the surface the preserved engine drives (#quiz-list etc.) -- */
function tutorQuizzesHTML(code){
  const quizzes=QUIZ_BANK.filter(q=>q.course===code);
  const listHTML = quizzes.length ? quizzes.map(qz=>{
    const best=state.quizScores?.[qz.id]; const total=qz.questions.length;
    const bestPct=best!=null?Math.round(best/total*100):null;
    const bestColor=bestPct==null?'var(--text3)':bestPct>=80?'var(--green)':bestPct>=60?'var(--yellow)':'var(--red)';
    return `<div class="quiz-card" onclick="openQuiz('${qz.id}')" style="cursor:pointer;border-left:3px solid ${courseColor(code)};">
      <div class="quiz-card-head"><div><div class="quiz-card-title">${qz.name}</div><div class="quiz-card-sub">${qz.topic}</div></div>
      <div class="quiz-best" style="color:${bestColor};">${best!=null?best+'/'+total:'—'}</div></div>
      <div class="quiz-meta">${total} questions · 5 options each${bestPct!=null?' · best '+bestPct+'%':' · not attempted'}</div>
    </div>`;
  }).join('') : `<div class="empty" style="padding:20px 6px">No practice quizzes for ${esc(code)} yet.<br>Question banks drop in here as they're authored.</div>`;
  return `<span id="study-sub"></span>
    <button id="quiz-back-btn" onclick="closeQuiz()">&larr; Back to quizzes</button>

      <div id="quiz-submit-wrap"><button class="btn btn-primary" onclick="submitQuiz()">Grade quiz</button></div>
      <div id="quiz-result-wrap"></div>
    </div>`;
}

   ============================================================ */
function renderPlanner(){
  const open=activeSorted();
  const groups=[
    {key:'over',  label:'Overdue',   test:a=>daysUntil(a.due)<0},
    {key:'today', label:'Today',     test:a=>daysUntil(a.due)===0},
    {key:'tom',   label:'Tomorrow',  test:a=>daysUntil(a.due)===1},
    {key:'week',  label:'This week',  test:a=>daysUntil(a.due)>=2&&daysUntil(a.due)<=7},
    {key:'later', label:'Later',      test:a=>daysUntil(a.due)>7}
  ];
  const slot=document.getElementById('plannerSlot');
  if(!open.length){slot.innerHTML=`<div class="rows"><div class="empty">${svg('smile')}<div class="big">Clear schedule.</div>Nothing on the horizon.</div></div>`;return;}
  slot.innerHTML=groups.map(g=>{
    const its=open.filter(g.test);
    if(!its.length) return '';
    const cls=g.key==='over'?'over':g.key==='today'?'today':'';
    return `<div class="plan-group">
      <div class="plan-label ${cls}"><span class="pl">${g.label}</span><span class="pd">${its.length}</span></div>
      <div class="rows">${its.map(a=>{const dl=dueLabel(a.due);const u=urgencyClass(a);
        return `<div class="row"><span class="sdot ${u}"></span><span class="ctag">${esc(a.course.split(' ')[0])}</span><span class="rtitle">${esc(a.title)}</span><span class="rdue ${dl.cls}">${fmtDue(a.due)}</span></div>`;}).join('')}</div>
    </div>`;
  }).join('');
}

  'SOC 205': { mode:'percent', categories:[{name:'Chapter Questions',weight:25},{name:'Discussion Board',weight:25},{name:'Midterm',weight:25},{name:'Final',weight:25}] },
  'ECO 101': { mode:'percent', categories:[{name:'Quiz',weight:30},{name:'Midterm',weight:35},{name:'Final',weight:35}] },

function renderGrades(){
  if(!Array.isArray(state.grades)) state.grades=[];
  const standing=document.getElementById('gradeStanding');
  const listEl=document.getElementById('gradeList');
  if(!standing||!listEl) return; // grades view not mounted
  const cSel=document.getElementById('g_course');
  if(cSel && !cSel.options.length) cSel.innerHTML = state.courses.map(c=>`<option value="${esc(c.code)}">${esc(c.code)}</option>`).join('');

  standing.innerHTML = state.courses.map(c=>{
    const code=c.code, cc=courseColor(code);
    const gs=state.grades.filter(g=>g.course===code);
    const grading=COURSE_GRADING[code];
    const chips = grading ? `<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:8px">`+grading.categories.map(cat=>{
        const label = grading.mode==='points' ? `${esc(cat.name)} · ${cat.points}pts` : `${esc(cat.name)} · ${cat.weight}%`;
        return `<span class="chip">${label}</span>`; }).join('')+`</div>` : '';
    let right;
    if(!gs.length){ right=`<span style="font-size:12px;color:var(--text3)">No grades yet</span>`; }
    else{
      const hasW=gs.some(g=>g.weight!=null);
      const avg=hasW?(()=>{const tw=gs.reduce((s,g)=>s+(g.weight||1),0);return Math.round(gs.reduce((s,g)=>s+g.pct*(g.weight||1),0)/tw);})():Math.round(gs.reduce((s,g)=>s+g.pct,0)/gs.length);
      right=`<span style="display:flex;align-items:center;gap:8px"><b class="mono" style="font-size:15px;color:${gradeColor(avg)}">${avg}%</b><span style="font-size:12px;font-weight:700;color:${gradeColor(avg)}">${letterGrade(avg)}</span></span>`;
    }
    const sub = gs.length?`<div style="font-size:11px;color:var(--text3);margin-top:2px">${gs.length} grade${gs.length>1?'s':''} recorded${gs.some(g=>g.weight!=null)?' · weighted avg':''}</div>`:'';
    return `<div class="card" style="margin-bottom:10px;border-left:3px solid ${cc}">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <span style="font-weight:700;font-size:13px;color:${cc}">${esc(code)}</span>${right}
      </div>${sub}${chips}</div>`;
  }).join('');

  if(!state.grades.length){
    listEl.innerHTML=`<div class="card" style="text-align:center;color:var(--text3);padding:22px">No grades yet — record one above as you get them.</div>`;
  }else{
    listEl.innerHTML=[...state.grades].sort((a,b)=>b.pct-a.pct).map(g=>{
      const cc=courseColor(g.course);
      return `<div class="card" style="display:flex;align-items:center;gap:10px;margin-bottom:8px;border-left:3px solid ${cc}">
        <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(g.name)}</div>
          <div style="font-size:11px;color:${cc}">${esc(g.course)}${g.weight!=null?` · <span style="color:var(--text3)">${g.weight}% weight</span>`:''}</div></div>
        <div class="mono" style="font-size:13px;font-weight:700">${g.score}/${g.outof}</div>
        <div style="font-size:12px;font-weight:700;color:${gradeColor(g.pct)}">${g.pct}%</div>
        <button class="icon-btn" style="width:32px;height:32px" onclick="deleteGrade('${g.id}')" aria-label="Delete grade">${svg('trash')}</button>
      </div>`; }).join('');
  }
  updateGradeCategories();
}

function updateGradeCategories(){
  const courseSel=document.getElementById('g_course');
  const sel=document.getElementById('g_cat');
  if(!courseSel||!sel) return;
  const grading=COURSE_GRADING[courseSel.value];
  sel.innerHTML='<option value="">— none —</option>';
  if(grading){ grading.categories.forEach(cat=>{
    const label=grading.mode==='points'?`${cat.name} (${cat.points} pts)`:`${cat.name} (${cat.weight}%)`;
    sel.innerHTML+=`<option value="${esc(cat.name)}">${label}</option>`; }); }
  const w=document.getElementById('g_weight'); if(w) w.value='';
}

function applyGradeCategory(){
  const courseSel=document.getElementById('g_course');
  const catSel=document.getElementById('g_cat');
  if(!courseSel||!catSel) return;
  const grading=COURSE_GRADING[courseSel.value];
  const cat=grading&&grading.categories.find(c=>c.name===catSel.value);
  if(!cat) return;
  const w=document.getElementById('g_weight');
  if(w) w.value = grading.mode==='percent'?cat.weight:Math.round((cat.points/grading.total)*100);
}

function addGrade(){
  const course=document.getElementById('g_course').value;
  const name=document.getElementById('g_name').value.trim();
  const score=parseFloat(document.getElementById('g_score').value);
  const outof=parseFloat(document.getElementById('g_outof').value);
  const wr=document.getElementById('g_weight').value;
  const weight=wr!==''?parseFloat(wr):null;
  if(!name||isNaN(score)||isNaN(outof)||outof<=0){ alert('Enter an assignment name, score, and a valid "out of" value.'); return; }
  if(!Array.isArray(state.grades)) state.grades=[];
  state.grades.push({id:uid(),course,name,score,outof,pct:Math.round((score/outof)*100),weight});
  saveState();
  ['g_name','g_score','g_outof','g_weight'].forEach(id=>document.getElementById(id).value='');
  renderGrades();
}

function deleteGrade(id){
  if(!confirm('Remove this grade?')) return;
  state.grades=(Array.isArray(state.grades)?state.grades:[]).filter(g=>g.id!==id);
  saveState();
  renderGrades();
}

// ============================================
/*
  PROFESSOR-STYLE QUESTION RULES  (the "logic" EVERY quiz in this app follows)
  These are the universal tutor-testing guidelines — they apply to ALL courses
  (POL 211, SOC 205, ECO 101, BIO 109, PSY 240, and any added later), not just
  the course they were first modeled on. Originally derived from real POL 211
  (Prof. Shane Martin) quizzes. Whenever authoring or generating practice
  questions for ANY course, follow these rules so practice matches the real thing:

   0. ★ CARDINAL RULE — WORK FROM THE SOURCE, NO AD-LIBS. Whenever at all
      possible, draw BOTH the questions AND the answers from the provided
      textbook or supplied course material — not from general/background
      knowledge. The point of practice is to match the actual course, so the
      source text is the authority. Do NOT invent facts, questions, or answer
      choices. If the needed material isn't available, say so and mark the item
      as UNVERIFIED rather than guessing — an ad-libbed question is worse than
      no question. (Rules 7 and 9 are specific applications of this.)

   1. FIVE options (a–e), never four. Guessing odds are 20%, not 25%.
   2. Homogeneous distractors: every wrong answer is a real term from the
      SAME family as the right one (e.g. reapportionment / redistricting /
      gerrymandering / malapportionment all together). No throwaway options.
   3. Length-matched: the correct answer is NOT the longest / most detailed.
   4. Twin answers: include near-identical choices that differ by ONE precise
      word or a reordered phrase, to test exact recall.
   5. EXCEPT / negative stems on some items ("all of the following EXCEPT").
      Mark these with type:'except' so the UI can flag the word.
   6. Reasoning stems, not just definitions ("It is difficult to X because...").
   7. Textbook-anchored where possible ("According to the textbook, ...").
   8. Every item has a short `explain` so review teaches, not just scores.
   9. Grade to the COURSE'S OWN textbook/answer key, not outside nuance. (POL 211
      keys "racial" as the controversial gerrymandering answer even though racial
      gerrymandering is illegal — the textbook's answer wins.)

  DATA SHAPE — add more quizzes/courses by pushing objects with this shape:
   {
     id, course, name, topic,
     questions: [
       { q:'stem', type:'standard'|'except', options:[5 strings], answer:index0-4, explain:'why' }
     ]
   }
*/

/*

  the quizzes. Add PRACTICE material we author here with the shape:
  { id, course, name, kind, tag, chapters:[{ n, qs:[strings] }] }.

  IMPORTANT (privacy rule): real course-provided material — exam questions,
  the professor's actual assignment/chapter questions, anything literally from

  content LOCAL only (see ~/Downloads study folder). This array holds
  practice-only content. (SOC 205 chapter questions were removed 2026-07-02.)
*/
const STUDY_RESOURCES = [];

/* ============================================================
   STUDY + QUIZ FUNCTIONS (existing — do not change)
   ============================================================ */
let activeQuiz=null, quizOrder=[], quizAnswers=[], quizGraded=false;

function renderStudy() {
  closeQuiz();
  const listEl = document.getElementById('quiz-list');
  document.getElementById('study-sub').textContent = "Practice quizzes & study resources";

  let html = '';

  // ---- Practice quizzes (interactive MC) ----
  html += `<div class="section-label">📝 Practice Quizzes</div>`;
  if (!QUIZ_BANK.length) {
    html += `<div class="card" style="text-align:center; color:var(--text2);">No practice quizzes yet.</div>`;
  } else {
    const byCourse = {};
    QUIZ_BANK.forEach(qz => { (byCourse[qz.course] = byCourse[qz.course] || []).push(qz); });
    Object.keys(byCourse).forEach(course => {
      byCourse[course].forEach(qz => {
        const best = state.quizScores?.[qz.id];
        const total = qz.questions.length;
        const bestPct = best != null ? Math.round((best / total) * 100) : null;
        const bestColor = bestPct == null ? 'var(--text3)' : bestPct >= 80 ? 'var(--green)' : bestPct >= 60 ? 'var(--yellow)' : 'var(--red)';
        html += `
          <div class="quiz-card" onclick="openQuiz('${qz.id}')" style="cursor:pointer; border-left:3px solid ${courseColor(course)};">
            <div class="quiz-card-head">
              <div>
                <div class="quiz-card-title">${course} · ${qz.name}</div>
                <div class="quiz-card-sub">${qz.topic}</div>
              </div>
              <div class="quiz-best" style="color:${bestColor};">${best != null ? best + '/' + total : '—'}</div>
            </div>
            <div class="quiz-meta">${total} questions · 5 options each${bestPct != null ? ' · best ' + bestPct + '%' : ' · not attempted'}</div>
          </div>`;
      });
    });
  }

  // ---- Study resources (read-only reference: chapter questions, guides) ----
  if (typeof STUDY_RESOURCES !== 'undefined' && STUDY_RESOURCES.length) {
    html += `<div class="section-label" style="margin-top:12px;">📄 Study Resources</div>`;
    STUDY_RESOURCES.forEach(r => {
      const nq = r.chapters.reduce((s, c) => s + c.qs.length, 0);
      html += `
        <div class="quiz-card" onclick="toggleResource('${r.id}')" style="cursor:pointer; border-left:3px solid ${courseColor(r.course)};">
          <div class="quiz-card-head">
            <div>
              <div class="quiz-card-title">${r.course} · ${r.name}</div>
              <div class="quiz-card-sub">${r.kind}${r.tag ? ' · ' + r.tag : ''}</div>
            </div>
            <div class="quiz-best" id="res-caret-${r.id}" style="color:var(--text3);">▸</div>
          </div>
          <div class="quiz-meta">${r.chapters.length} chapters · ${nq} questions</div>
          <div id="res-body-${r.id}" style="display:none; margin-top:10px;" onclick="event.stopPropagation()">${renderResourceBody(r)}</div>
        </div>`;
    });

  listEl.innerHTML = html;
}

function renderResourceBody(r) {
  return r.chapters.map(c => `
    <div style="margin-bottom:12px;">
      <div style="font-weight:700; font-size:13px; color:var(--text); margin-bottom:6px; font-family:'JetBrains Mono',monospace;">Chapter ${c.n}</div>
      <ol style="margin:0; padding-left:18px; color:var(--text2); font-size:13px; line-height:1.55;">
        ${c.qs.map(q => `<li style="margin-bottom:5px;">${q}</li>`).join('')}
      </ol>
    </div>`).join('');
}

function toggleResource(id) {
  const body = document.getElementById('res-body-' + id);
  const caret = document.getElementById('res-caret-' + id);
  if (!body) return;
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  if (caret) caret.textContent = open ? '▸' : '▾';
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function openQuiz(id) {
  activeQuiz = QUIZ_BANK.find(q => q.id === id);
  if (!activeQuiz) return;
  quizOrder = shuffle(activeQuiz.questions.map((_, i) => i));
  quizAnswers = quizOrder.map(() => null);
  quizGraded = false;

  document.getElementById('quiz-list').style.display = 'none';
  document.getElementById('quiz-runner').style.display = 'block';
  document.getElementById('quiz-back-btn').style.display = 'inline-block';
  document.getElementById('study-sub').textContent = activeQuiz.name;
  document.getElementById('quiz-result-wrap').innerHTML = '';
  document.getElementById('quiz-submit-wrap').style.display = 'flex';
  renderQuizQuestions();
  window.scrollTo(0, 0);
}

function closeQuiz() {
  activeQuiz = null; quizGraded = false;
  const runner = document.getElementById('quiz-runner');
  const list = document.getElementById('quiz-list');
  const back = document.getElementById('quiz-back-btn');
  if (runner) runner.style.display = 'none';
  if (list) list.style.display = 'block';
  if (back) back.style.display = 'none';
}

const LETTERS = ['a', 'b', 'c', 'd', 'e'];

function renderQuizQuestions() {
  let html = '';
  quizOrder.forEach((qi, displayIdx) => {
    const item = activeQuiz.questions[qi];
    const sel = quizAnswers[displayIdx];
    let stem = item.q;
    if (item.type === 'except') stem = stem.replace(/\bEXCEPT\b/, '<span class="except">EXCEPT</span>');

    html += `<div class="q-block">
      <div class="q-num">QUESTION ${displayIdx + 1}</div>
      <div class="q-stem">${stem}</div>`;

    item.options.forEach((opt, oi) => {
      let cls = 'opt';
      if (quizGraded) {
        cls += ' locked';
        if (oi === item.answer) cls += ' correct';
        else if (oi === sel) cls += ' wrong';
      } else if (oi === sel) {
        cls += ' selected';
      }
      const click = quizGraded ? '' : ` onclick="selectOption(${displayIdx}, ${oi})"`;
      html += `<div class="${cls}"${click}>
          <span class="opt-letter">${LETTERS[oi]}</span>
          <span>${opt}</span>
        </div>`;
    });

    if (quizGraded) {
      html += `<div class="q-explain"><strong>${sel === item.answer ? '✓ Correct.' : (sel == null ? '○ Skipped.' : '✕ Not quite.')}</strong> ${item.explain}</div>`;
    }
    html += `</div>`;
  });
  document.getElementById('quiz-questions').innerHTML = html;
  updateQuizProgress();
}

function selectOption(displayIdx, oi) {
  if (quizGraded) return;
  quizAnswers[displayIdx] = oi;
  renderQuizQuestions();
}

function updateQuizProgress() {
  const answered = quizAnswers.filter(a => a != null).length;
  const pct = Math.round((answered / quizAnswers.length) * 100);
  document.getElementById('quiz-progress-fill').style.width = pct + '%';
}

function submitQuiz() {
  const unanswered = quizAnswers.filter(a => a == null).length;
  if (unanswered > 0 && !quizGraded) {
    if (!confirm(`${unanswered} question${unanswered > 1 ? 's' : ''} still blank. Grade anyway?`)) return;
  }
  quizGraded = true;

  let correct = 0;
  quizOrder.forEach((qi, displayIdx) => {
    if (quizAnswers[displayIdx] === activeQuiz.questions[qi].answer) correct++;
  });
  const total = quizOrder.length;
  const pct = Math.round((correct / total) * 100);

  // persist best score
  if (!state.quizScores) state.quizScores = {};
  if (state.quizScores[activeQuiz.id] == null || correct > state.quizScores[activeQuiz.id]) {
    state.quizScores[activeQuiz.id] = correct;
    saveState();
  }

  const color = pct >= 80 ? 'var(--green)' : pct >= 60 ? 'var(--yellow)' : 'var(--red)';
  const msg = pct >= 80 ? 'Solid — you\'re quiz-ready.' : pct >= 60 ? 'Getting there. Review the misses below.' : 'Keep drilling — read the explanations under each miss.';
  document.getElementById('quiz-submit-wrap').style.display = 'none';
  document.getElementById('quiz-result-wrap').innerHTML = `
    <div class="quiz-result">
      <div class="quiz-score-big" style="color:${color};">${correct}/${total}</div>
      <div class="quiz-score-pct">${pct}% · ${msg}</div>
    </div>
    <div class="quiz-actions">
      <button class="btn" onclick="openQuiz('${activeQuiz.id}')">↻ Retake (reshuffle)</button>
      <button class="btn btn-primary" onclick="renderStudy()">✓ Done</button>
    </div>`;

  renderQuizQuestions();
  window.scrollTo(0, 0);
}

/* ============================================================
   BOOT
   ============================================================ */
buildNav();
loadState();
initFiles();
renderDashboard();
updateClock();
setInterval(updateClock, 60000);
if(document.getElementById("all-grades-list")) renderGrades();
updateGradeCategories();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
</script>
